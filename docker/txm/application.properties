
###############################################################################
# Tranxmart container defaults. Appended to the external file read by Spring AND
# ConfigRefreshComponent. Mount a complete replacement at that same file path.
###############################################################################
office.home = ${KK_OFFICE_HOME:/usr/lib/libreoffice}
file.dir = ${KK_FILE_DIR:/var/cache/kkfileview/previews/}
cache.type = jdk
file.upload.disable = true
kk.addTask = false
kk.scriptjs = false
kk.xlsxallowedit = false
kk.xlsxshowtoolbar = false
management.endpoints.web.exposure.include = health
management.endpoint.health.show-details = never

name: TXM container

on:
  pull_request:
    branches: [master, txm-release-v5.0.3]
  push:
    branches: [master, txm-release-v5.0.3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: txm-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify upstream baseline
        run: python3 docker/txm/check-baseline.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run Java security and viewer regression tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.txm
          target: java-checks
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=txm-kkfileview
          cache-to: type=gha,mode=max,scope=txm-kkfileview
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.txm
          platforms: linux/amd64
          load: true
          push: false
          tags: kkfileview:txm-local
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=txm-kkfileview
          cache-to: type=gha,mode=max,scope=txm-kkfileview
      - name: Test the built image with Chromium
        run: sh docker/txm/check-container.sh
      - name: Upload preview screenshots, traces and container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: txm-container-checks
          path: .artifacts/txm
          if-no-files-found: ignore
